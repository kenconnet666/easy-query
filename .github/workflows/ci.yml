# fork 的 CI：PR 与推到 main 时跑。上游的 release.yml 只由 tag 触发，这里不碰它。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 产物要给 Java 8 用：用真正的 JDK 8 编译与测试（source/target 8 拦不住 9+ 的 API）。
  # sql-springboot4-starter 要求 Java 17，在下一个 job 单独构建。
  java8:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          cache: maven
      - name: 构建全部模块并跑 sql-fork-test（含上游不连库的用例）
        run: bash ./mvnw -B -T 2 -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -pl '!sql-extension/sql-springboot4-starter' install
      - name: 保存测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-test-reports
          path: sql-fork-test/target/surefire-reports/
          retention-days: 7

  springboot4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven
      - name: 构建 sql-springboot4-starter 及其依赖
        run: bash ./mvnw -B -T 2 -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -DskipTests -pl sql-extension/sql-springboot4-starter -am install

  # TS 版（ts/）：类型检查（含 50 实体类型样板）+ SQLite 单测 + 在 MySQL 8.0.18（PolarDB 基线）上跑共用套件
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ts
    services:
      mysql:
        image: mysql:8.0.18
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ts/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
        env:
          EQTS_MYSQL_URLS: mysql://root:root@127.0.0.1:3306
